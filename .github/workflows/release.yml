name: 发布

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 验证
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
      - name: 安装 GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: v2.20.1
      - name: 构建发行文件
        run: goreleaser release --clean --skip=publish
      - name: 生成包管理器清单
        run: python3 scripts/package-metadata.py "$GITHUB_REF_NAME"
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/*.deb \
            dist/checksums.txt dist/v2term.rb --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
