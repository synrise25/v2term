name: APT 软件源

on:
  workflow_call:
    secrets:
      APT_SIGNING_KEY:
        required: true
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/apt.yml
      - scripts/build-apt-repo.py
      - packaging/apt/**

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.download.outputs.package_version }}
    steps:
      - uses: actions/checkout@v6
      - name: 下载稳定版安装包并保留历史版本
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --json tagName --jq .tagName)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/stable-tags"
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release download "$tag" --pattern '*.deb' --pattern checksums.txt --dir "$RUNNER_TEMP/deb/$tag"
            (cd "$RUNNER_TEMP/deb/$tag" && sha256sum --check --ignore-missing checksums.txt)
          done < "$RUNNER_TEMP/stable-tags"
          expected_file="$RUNNER_TEMP/deb/$latest_tag/v2term_${latest_tag#v}_amd64.deb"
          package_version=$(dpkg-deb --field "$expected_file" Version)
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
      - name: 生成索引
        run: python3 scripts/build-apt-repo.py "$RUNNER_TEMP/deb" "$RUNNER_TEMP/apt-site"
      - name: 签名并验证索引
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --show-keys --with-colons packaging/apt/v2term.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          release="$RUNNER_TEMP/apt-site/apt/dists/stable/Release"
          gpg --batch --local-user "$fingerprint" --digest-algo SHA256 --clearsign --output "${release%Release}InRelease" "$release"
          gpg --batch --local-user "$fingerprint" --digest-algo SHA256 --armor --detach-sign --output "$release.gpg" "$release"
          gpg --batch --dearmor --output "$RUNNER_TEMP/apt-keyring.gpg" packaging/apt/v2term.asc
          gpgv --keyring "$RUNNER_TEMP/apt-keyring.gpg" "${release%Release}InRelease"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/apt-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  install:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证真实 APT 安装
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          sudo install -d -m 755 /etc/apt/keyrings
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL https://synrise25.github.io/v2term/apt/v2term.asc | sudo tee /etc/apt/keyrings/v2term.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/v2term.asc] https://synrise25.github.io/v2term/apt stable main" | sudo tee /etc/apt/sources.list.d/v2term.list
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/v2term.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 \
              && sudo apt-get install -y "v2term=$EXPECTED_VERSION" \
              && test "$(dpkg-query -W -f='${Version}' v2term)" = "$EXPECTED_VERSION" \
              && test "$(v2term --version)" = "v2term $EXPECTED_VERSION"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
